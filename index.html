<style>
:root{--ink:#111;--red:#c8102e;--red2:#a30d26;--gold:#b8892b;--goldbg:#fbf3df;--bg:#fff;--soft:#f6f4f1;--line:#e9e5df;--mut:#6b665e;--ok:#1f7a45;--okbg:#e5f4ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

input,select,textarea{font:inherit;color:inherit}

.tabbar button svg{width:22px;height:22px}.tabbar button.on{color:var(--red)}.tabbar button i{position:absolute;top:2px;left:55%;background:var(--red);color:#fff;border-radius:10px;font-style:normal;font-size:11px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fact{background:var(--soft);border-radius:12px;padding:10px;text-align:center;font-size:14px}.fact b{display:block;font-size:16px}

.hero{position:relative;min-height:100vh;overflow:hidden;background:#111}.hero .sl{position:absolute;left:0;right:0;top:0;aspect-ratio:1/1;max-width:480px;margin:0 auto;opacity:0;transition:opacity .8s}.hero .sl.on{opacity:1}.hero .sl img{width:100%;height:100%;object-fit:cover}

.rc{display:flex;gap:14px;align-items:center;text-align:left;width:calc(100% - 32px);margin:0 16px 12px;padding:16px;border:1.5px solid var(--line);border-radius:16px}.rc:active{border-color:var(--red)}.rc .ic{width:48px;height:48px;border-radius:14px;background:var(--goldbg);display:grid;place-items:center;flex:0 0 auto;font-size:22px}

.feat{display:flex;gap:12px;align-items:flex-start;padding:8px 0}.feat>span{width:38px;height:38px;border-radius:10px;background:var(--goldbg);color:var(--gold);display:grid;place-items:center;flex:0 0 auto}.sec{padding:16px;border-bottom:8px solid var(--soft)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:16px}.kv.t{border-top:1.5px solid var(--ink);margin-top:6px;padding-top:10px;font-weight:800}
.demo{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));right:max(8px,calc(50% - 232px));z-index:40;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;opacity:.85}#app.nobar .demo{bottom:calc(14px + env(safe-area-inset-bottom))}
.cb{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:16px}.cb input{width:22px;height:22px;accent-color:var(--red);margin-top:2px;flex:0 0 auto}
.empty{text-align:center;color:var(--mut);padding:40px 24px}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}

:root{--olive:#7f8d9b;--olive2:#5d6b79;--olivebg:#eef1de;--gold2:#e6c984;--ok:#566a22;--okbg:#eef1de;--ink:#0f0f0d;--soft:#f7f5f0;--line:#e8e3d8}

/* ===== v7: logo, themes, glass, welcome, login, booking, profile ===== */
:root{--acc:#5d6b79;--acc2:#7f8d9b;--accbg:#eef1de;--gl-blur:22px;--gl-bg:.62;--gl-line:.7}
html[data-acc=red]{--acc:#c8102e;--acc2:#a30d26;--accbg:#fbe9ec;--olive:#c8102e;--olive2:#a30d26;--olivebg:#fbe9ec}
html[data-glass=clear]{--gl-blur:6px;--gl-bg:.18;--gl-line:.45}
html[data-glass=blur]{--gl-blur:34px;--gl-bg:.4;--gl-line:.55}
.swn{display:inline-block;vertical-align:middle;object-fit:contain}
.logo{gap:10px}
html .btn:not(.ol):not(.dk):not(.gh):not(.gd){background:var(--acc);color:#fff;border-color:var(--acc)}
html .btn:not(.ol):not(.dk):not(.gh):not(.gd):active{filter:brightness(.9)}
.top,.tabbar,.abar,.cin{-webkit-backdrop-filter:blur(var(--gl-blur)) saturate(180%);backdrop-filter:blur(var(--gl-blur)) saturate(180%)}
.top{background:rgba(255,255,255,calc(var(--gl-bg) + .1))}
.sheet{-webkit-backdrop-filter:blur(calc(var(--gl-blur) + 8px)) saturate(190%);backdrop-filter:blur(calc(var(--gl-blur) + 8px)) saturate(190%);background:rgba(255,255,255,calc(var(--gl-bg) + .3))}
.tabbar .on,.tabbar button.on{color:var(--acc)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
/* dark theme */
html[data-theme=dark]{--bg:#0d0d0b;--ink:#f3f0e6;--soft:#171714;--line:#2b2a25;--mut:#a7a293;--ok:#a9c45a;--okbg:#1f2810;--accbg:#1f2810;color-scheme:dark}

html[data-theme=dark] .top{background:rgba(13,13,11,calc(var(--gl-bg) + .25));border-color:rgba(255,255,255,.08);color:var(--ink)}
html[data-theme=dark] .tabbar,html[data-theme=dark] .abar,html[data-theme=dark] .cin{background:rgba(24,24,20,calc(var(--gl-bg) + .2));border-color:rgba(255,255,255,.12);color:var(--ink)}
html[data-theme=dark] .sheet{background:rgba(22,22,18,calc(var(--gl-bg) + .35));border-color:rgba(255,255,255,.12);color:var(--ink)}
html[data-theme=dark] .ib{background:#1d1c18;color:var(--ink)}
html[data-theme=dark] .sm,html[data-theme=dark] .sl1{color:var(--mut)}
html[data-theme=dark] .note{background:#171714;color:var(--ink);border-color:var(--line)}
html[data-theme=dark] .pill{background:#1d1c18;color:var(--ink)}
html[data-theme=dark] .swn:not(.keep){filter:brightness(0) invert(1)}
html[data-theme=dark] .kv{border-color:var(--line)}

.hero .sh{aspect-ratio:auto;max-width:none;height:100%;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.05) 30%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.72) 100%)}

/* explore panel photo */
